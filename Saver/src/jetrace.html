<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;cursor:none}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#ff7a1a;font-weight:600;font-size:14px;letter-spacing:.08em;z-index:8}
body.active{cursor:default}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#fade{position:fixed;inset:0;background:#000;opacity:1;pointer-events:none}
#err{display:none;position:fixed;left:12px;bottom:12px;right:12px;white-space:pre-wrap;font:12px/1.4 Menlo,monospace;color:#ffb4a8;background:rgba(40,0,0,.8);padding:10px;border-radius:6px;z-index:9}
#board{position:fixed;left:22px;top:22px;min-width:210px;background:rgba(8,10,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;overflow:hidden;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#bhead{display:flex;justify-content:space-between;gap:18px;padding:7px 12px;background:#ff7a1a;color:#0b0b0c;font-weight:800;font-size:12px;letter-spacing:.08em;text-shadow:none}
.row{display:flex;align-items:center;gap:9px;padding:6px 12px;font-size:13px;border-top:1px solid rgba(255,255,255,.07)}
.pos{width:12px;font-weight:800;opacity:.85}
.chip{display:inline-block;min-width:26px;text-align:center;padding:2px 5px;border-radius:4px;font-weight:900;font-style:italic;text-shadow:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.nm{font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.9;flex:1}
.gap{font-weight:600;font-size:12px}
.hs{display:inline-block;margin-left:5px;padding:0 4px;border-radius:3px;background:#ff7a1a;color:#0b0b0c;font-size:9px;font-weight:900;letter-spacing:.04em;line-height:13px;vertical-align:1px;text-shadow:none}
#cap{position:fixed;left:24px;bottom:22px;font-size:11px;letter-spacing:.22em;font-weight:700;opacity:.75;text-shadow:0 1px 3px #000}
#win{position:fixed;left:50%;bottom:4%;transform:translate(-50%,24px);opacity:0;transition:opacity .5s,transform .5s;background:rgba(8,10,14,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-left:6px solid #ff7a1a;padding:14px 26px 14px 20px;border-radius:6px;font-size:34px;font-weight:900;font-style:italic;letter-spacing:.04em;white-space:nowrap}
#win.on{opacity:1;transform:translate(-50%,0)}
#win small{display:block;font-size:12px;font-style:normal;font-weight:600;letter-spacing:.14em;opacity:.75;margin-top:5px}
.chip.big{font-size:30px;padding:2px 12px;margin-right:8px}
#gear,#panel{opacity:0;transition:opacity .35s;pointer-events:none}
body.active #gear,body.active #panel.open,#panel.open{opacity:1;pointer-events:auto}
#gear{position:fixed;right:20px;top:20px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(8,10,14,.6);color:#fff;font-size:19px;cursor:pointer}
#panel{position:fixed;right:20px;top:68px;width:250px;background:rgba(8,10,14,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:10px;padding:14px 16px;font-size:13px;display:none}
#panel.open{display:block}
#panel h3{margin:0 0 10px;font-size:11px;letter-spacing:.18em;color:#ff7a1a}
#panel label{display:block;margin:9px 0 4px;font-size:11px;letter-spacing:.08em;opacity:.75}
#panel select{width:100%;padding:6px;border-radius:5px;border:1px solid #444;background:#15181d;color:#fff;font-size:13px}
#panel .ck{display:flex;align-items:center;gap:8px;margin-top:10px;opacity:1;font-size:13px;letter-spacing:0}
#panel button{margin-top:13px;width:100%;padding:8px;border:0;border-radius:5px;background:#ff7a1a;color:#0b0b0c;font-weight:800;letter-spacing:.06em;cursor:pointer}
#panel p{margin:11px 0 0;font-size:10.5px;line-height:1.5;opacity:.6}
</style></head><body>
<canvas id="view"></canvas>
<div id="board"><div id="bhead"><span id="lap"></span><span id="clock"></span></div><div id="rows"></div></div>
<div id="cap"></div>
<div id="win"></div>
<button id="gear" title="Settings" aria-label="Settings">&#9881;</button>
<div id="panel">
  <h3>WATERCRAFT RACING SCREEN SAVER</h3>
  <label for="selCam">Camera</label><select id="selCam"></select>
  <label for="selFol">Follow</label><select id="selFol"></select>
  <label for="selWin">Winner</label><select id="selWin"></select>
  <label for="selCel">Winner celebration</label><select id="selCel"></select>
  <label class="ck"><input type="checkbox" id="chkBoard"> Leaderboard</label>
  <label class="ck"><input type="checkbox" id="chkCap"> Camera captions</label>
  <button id="btnNew">NEW RACE</button>
  <p>Keys: C next camera · D director · 1 / 2 / 3 follow Skeeter / Skison / Jorge · L leader · B leaderboard · W next winner choice · V next celebration · P preview it now (ends the race) · N new race · F fast-forward</p>
</div>
<div id="fade"></div>
<div id="loading">/*LOADING*/</div>
<div id="err"></div>
<script type="application/octet-stream" id="ski16">/*GLB:ski16*/</script>
<script type="application/octet-stream" id="ski8">/*GLB:ski8*/</script>
<script type="application/octet-stream" id="ski3">/*GLB:ski3*/</script>
<script type="application/octet-stream" id="riderTall">/*GLB:riderTall*/</script>
<script type="application/octet-stream" id="rider8">/*GLB:rider8*/</script>
<script type="application/octet-stream" id="rider3">/*GLB:rider3*/</script>
<script>/*THREE*/</script>
<script>/*GLTFLOADER*/</script>
<script>/*JETRACE*/</script>
</body></html>
