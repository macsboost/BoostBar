name: Settings Preview

# Renders every tab of BoostBar's Settings window to an image, to check the layout without a Mac at hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Sources/BoostBar/SettingsWindow.swift", ".github/workflows/settings-preview.yml"]

concurrency:
  group: settings-preview
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build 2>&1 | tail -25
      - name: Snapshot
        run: |
          BIN=$(swift build --show-bin-path)/BoostBar
          "$BIN" --snapshot-settings "$PWD/snaps" 2>&1 | tail -20 || true
          for f in snaps/*.png; do
            n=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 70 "$f" --out "snaps/$n.jpg" >/dev/null 2>&1 || true
            echo "IMG_BEGIN ${n}.jpg"; base64 -i "snaps/$n.jpg" | tr -d '\n'; echo; echo "IMG_END"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: settings
          path: snaps/*.png
