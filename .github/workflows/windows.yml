name: Windows Build & Release

# Builds BoostBar for Windows (app + screen savers + Inno Setup installer) and attaches BoostBar-Setup.exe and its
# SHA-256 to the same v<VERSION> release as the Mac zip. Also renders the strip and every window to PNGs for review.
on:
  push:
    branches: [main, windows]
    tags: ["v*"]
    paths:
      - "windows/**"
      - "Saver/src/**"
      - "Saver/thumbs/**"
      - "tools/build_saver_html.py"
      - "Resources/SupportBanner.jpg"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/windows.yml"
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v") } else { $v = (Get-Content VERSION -Raw).Trim() }
          ./windows/build.ps1 -Version $v

      - name: Render snapshots
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force snapshots | Out-Null
          $p = Start-Process -FilePath build/win/app/BoostBar.exe -ArgumentList "--snapshot", "$PWD\snapshots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Warning "snapshot timed out" }
          Get-ChildItem snapshots | Format-Table Name, Length

      - name: Smoke test (run the app and a screen saver, screenshot the desktop)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force snapshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\snapshots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          $app = Start-Process build/win/app/BoostBar.exe -PassThru
          Start-Sleep 15
          Shot "smoke_desktop"
          "BoostBar running after 15 s: $(-not $app.HasExited)" | Tee-Object snapshots/smoke.txt
          Get-Process | Where-Object { $_.ProcessName -in 'explorer','BoostBar' } | Format-Table ProcessName, Id | Out-String | Add-Content snapshots/smoke.txt
          if ($app.HasExited) { "Exit code: $($app.ExitCode)" | Add-Content snapshots/smoke.txt }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
            ForEach-Object { "---- $($_.ProviderName)`n$($_.Message)" } | Add-Content snapshots/smoke.txt
          Copy-Item build/win/saver/BoostBarSaver.exe build/win/saver/BoostBarFlyingCars.scr
          New-Item -ItemType Directory -Force build/win/saver/savers | Out-Null
          Copy-Item build/win/savers/*.html build/win/saver/savers/
          $s = Start-Process build/win/saver/BoostBarFlyingCars.scr -ArgumentList "/w" -PassThru
          Start-Sleep 20
          Shot "smoke_saver"
          "Saver running after 20 s: $(-not $s.HasExited)" | Add-Content snapshots/smoke.txt
          if (-not $s.HasExited) { $s.Kill() }
          # Starlink flying up and to the right (flock angle 45°), to check entry/exit at a non-default angle
          New-Item -ItemType Directory -Force "$env:APPDATA\BoostBar" | Out-Null
          '{"starlink":{"count":69,"heading":45}}' | Set-Content -Encoding utf8 "$env:APPDATA\BoostBar\Screen Savers.json"
          Copy-Item build/win/saver/BoostBarSaver.exe build/win/saver/BoostBarStarlink.scr
          $s2 = Start-Process build/win/saver/BoostBarStarlink.scr -ArgumentList "/w" -PassThru
          Start-Sleep 25
          Shot "smoke_starlink_45"
          if (-not $s2.HasExited) { $s2.Kill() }
          # Jet Racers with #8 set to win: on the start line, then out on the course
          '{"jetrace":{"winner":"8","celebration":"backflip","captions":true}}' | Set-Content -Encoding utf8 "$env:APPDATA\BoostBar\Screen Savers.json"
          Copy-Item build/win/saver/BoostBarSaver.exe build/win/saver/BoostBarWatercraftRacing.scr
          $s3 = Start-Process build/win/saver/BoostBarWatercraftRacing.scr -ArgumentList "/w" -PassThru
          Start-Sleep 20
          Shot "smoke_jetrace_start"
          Start-Sleep 25
          Shot "smoke_jetrace_race"
          "Jet Racers running after 45 s: $(-not $s3.HasExited)" | Add-Content snapshots/smoke.txt
          if (-not $s3.HasExited) { $s3.Kill() }
          if (-not $app.HasExited) { $app.Kill() }
          Remove-Item build/win/saver/BoostBarFlyingCars.scr, build/win/saver/BoostBarStarlink.scr, build/win/saver/BoostBarWatercraftRacing.scr, build/win/saver/savers -Recurse -Force
          $log = "$env:LOCALAPPDATA\BoostBar\BoostBar.log"
          if (Test-Path $log) { Copy-Item $log snapshots/BoostBar.log; Get-Content $log }

      - uses: actions/upload-artifact@v4
        with:
          name: BoostBar-Windows
          path: |
            build/win/out/BoostBar-Setup.exe
            build/win/out/BoostBar-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-snapshots
          path: snapshots/
          if-no-files-found: ignore

      - name: Publish snapshots to the win-snapshots branch
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          [[ -d snapshots ]] || exit 0
          cd snapshots
          git init -q -b win-snapshots
          git -c user.name="github-actions" -c user.email="actions@github.com" add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Windows snapshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" win-snapshots

      - name: Attach to GitHub release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then TAG="v$(tr -d '[:space:]' < VERSION)"
          else echo "Not a release ref"; exit 0; fi
          A=build/win/out/BoostBar-Setup.exe
          # The Mac workflow normally creates the release; give it time, then create it ourselves if it never shows.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 60; done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$A" "$A.sha256" --target "$GITHUB_SHA" --title "BoostBar $TAG" --generate-notes \
              || gh release upload "$TAG" "$A" "$A.sha256" --clobber
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]] || ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "BoostBar-Setup.exe"; then
            gh release upload "$TAG" "$A" "$A.sha256" --clobber
          else
            echo "Release $TAG already has the Windows installer; bump VERSION to publish a new one."
          fi
