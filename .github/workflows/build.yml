name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build universal app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          chmod +x scripts/build-app.sh
          UNIVERSAL=1 ./scripts/build-app.sh "$VERSION"
          lipo -info dist/BoostBar.app/Contents/MacOS/BoostBar

      - uses: actions/upload-artifact@v4
        with:
          name: BoostBar
          path: dist/BoostBar.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/BoostBar.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/BoostBar.zip \
              --title "BoostBar $GITHUB_REF_NAME" --generate-notes
          fi
