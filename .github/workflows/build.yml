name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build universal app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          chmod +x scripts/build-app.sh
          UNIVERSAL=1 ./scripts/build-app.sh "$VERSION"
          lipo -info dist/BoostBar.app/Contents/MacOS/BoostBar

      - uses: actions/upload-artifact@v4
        with:
          name: BoostBar
          path: dist/BoostBar.zip

      - name: Publish GitHub release
        # Releases when a v* tag is pushed, or when main has a VERSION with no release yet
        # (bump VERSION + push = new release), or on a manual run.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
          else
            echo "Not a release ref"; exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              gh release upload "$TAG" dist/BoostBar.zip --clobber
            else
              echo "Release $TAG already exists; bump VERSION to publish a new one."
            fi
          else
            gh release create "$TAG" dist/BoostBar.zip --target "$GITHUB_SHA" \
              --title "BoostBar $TAG" --generate-notes
          fi
