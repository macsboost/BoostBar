name: App Store Edition

# Every push compiles the sandboxed App Store edition (catches build breaks).
# A manual run ("Run workflow", upload = true) signs it, packages it and uploads it to App Store Connect.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  appstore:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import App Store certificates + profile
        id: certs
        env:
          MAS_APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          if [[ -z "$MAS_APP_CERT_P12" || -z "$MAS_INSTALLER_CERT_P12" || -z "$MAS_PROVISION_PROFILE" ]]; then
            echo "App Store signing secrets not set — compile check only."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/mas.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          for c in MAS_APP_CERT_P12 MAS_INSTALLER_CERT_P12; do
            echo "${!c}" | base64 --decode > "$RUNNER_TEMP/$c.p12"
            security import "$RUNNER_TEMP/$c.p12" -k "$KC" -P "$MAS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/$c.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          APP_ID="$(security find-identity -v -p codesigning "$KC" | grep -E '"(Apple Distribution|3rd Party Mac Developer Application):' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          INST_ID="$(security find-identity -v "$KC" | grep -E '"(3rd Party Mac Developer Installer|Mac Installer Distribution):' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [[ -n "$APP_ID" ]] || { echo "::error::No 'Apple Distribution' identity in MAS_APP_CERT_P12"; exit 1; }
          [[ -n "$INST_ID" ]] || { echo "::error::No 'Mac Installer Distribution' identity in MAS_INSTALLER_CERT_P12"; exit 1; }
          echo "App signing:       $APP_ID"
          echo "Installer signing: $INST_ID"

          echo "$MAS_PROVISION_PROFILE" | base64 --decode > "$RUNNER_TEMP/BoostBar.provisionprofile"
          TEAM="$(security cms -D -i "$RUNNER_TEMP/BoostBar.provisionprofile" | plutil -extract TeamIdentifier.0 raw -)"
          echo "Team: $TEAM"
          {
            echo "ready=true"
            echo "app_identity=$APP_ID"
            echo "installer_identity=$INST_ID"
            echo "team=$TEAM"
          } >> "$GITHUB_OUTPUT"

      - name: Compile check (unsigned)
        if: steps.certs.outputs.ready != 'true'
        run: swift build -c release -Xswiftc -DAPPSTORE

      - name: Build signed App Store package
        if: steps.certs.outputs.ready == 'true'
        env:
          EDITION: appstore
          UNIVERSAL: "1"
          SIGN_IDENTITY: ${{ steps.certs.outputs.app_identity }}
          INSTALLER_IDENTITY: ${{ steps.certs.outputs.installer_identity }}
          TEAM_ID: ${{ steps.certs.outputs.team }}
        run: |
          export PROVISION_PROFILE="$RUNNER_TEMP/BoostBar.provisionprofile"
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh
          codesign -d --entitlements - dist/BoostBar.app 2>/dev/null | head -40
          pkgutil --check-signature dist/BoostBar.pkg | head -5

      - uses: actions/upload-artifact@v4
        if: steps.certs.outputs.ready == 'true'
        with:
          name: BoostBar-AppStore
          path: dist/BoostBar.pkg

      - name: Upload to App Store Connect
        if: steps.certs.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          if [[ "$APPLE_API_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          else echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"; fi
          xcrun altool --validate-app -f dist/BoostBar.pkg -t macos --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          xcrun altool --upload-app   -f dist/BoostBar.pkg -t macos --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY"
