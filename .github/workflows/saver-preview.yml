name: Screen Saver Preview

# Renders the Flying Cars scene in headless Chrome (software WebGL) and saves screenshots,
# so changes to the scene or liveries can be checked without installing the saver.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Saver/**", "tools/build_saver_html.py", "tools/macsboost_livery.py", ".github/workflows/saver-preview.yml"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build scene page
        run: |
          mkdir -p build/saver out
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o build/saver/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o build/saver/GLTFLoader.js
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/saver.html
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/starships.html starships
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/starlink.html starlink
      - name: WebKit check (as the .saver loads it)
        run: |
          swift tools/webkit_check.swift out/starships.html '{"count":4,"oxidation":0.8}' || true
          swift tools/webkit_check.swift out/saver.html '{"count":5}' | grep -v "^IMG\|^[A-Za-z0-9+/=]\{200,\}" || true
      - name: Screenshots
        run: |
          npm install --no-save --silent puppeteer-core@23
          node tools/saver_shots.mjs "$PWD/out/starships.html" out oxhalf '{"count":4,"oxidation":0.5}'
          node tools/saver_shots.mjs "$PWD/out/starships.html" out oxfull '{"count":4,"oxidation":1}'
          for f in out/oxhalf_1.png out/oxfull_1.png out/oxfull_2.png; do
            sips -s format jpeg -s formatOptions 60 --resampleWidth 720 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "IMG_BEGIN $(basename "$f")"; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "IMG_END"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: saver-preview
          path: |
            out/*.png
