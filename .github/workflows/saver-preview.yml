name: Screen Saver Preview

# Renders the screen saver scenes (natively with SceneKit/Metal, and their pages in headless Chrome with software
# WebGL) and saves the frames, so changes can be checked without installing a saver.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Saver/**", "tools/native_check/**", "tools/jetrace_check/**", "tools/jetrace_test.js", "tools/build_saver_html.py", "tools/macsboost_livery.py", ".github/workflows/saver-preview.yml"]

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build scene page
        run: |
          mkdir -p build/saver out
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o build/saver/three.min.js
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o build/saver/GLTFLoader.js
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/saver.html
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/starships.html starships
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/starlink.html starlink
      - name: Native (SceneKit/Metal) check
        run: |
          mkdir -p build/native_res
          cp Saver/native/X1_*.glb Saver/src/Starship.glb Saver/src/Roadster.glb Saver/src/Starlink.glb build/native_res/
          swiftc -O tools/native_check/main.swift Saver/native/GLB.swift Saver/native/Flock.swift -o build/native_check
          ./build/native_check build/native_res > build/native.txt 2>&1 || true
          grep -v "^[A-Za-z0-9+/=]\{200,\}" build/native.txt | head -40
          for n in native_cars cars_clouds native_ships roadster_a roadster_b roadster_c ships_roadster ships_roadster_stable native_sats close_car close_ship close_ship2 close_sat close_v2 dep_a dep_b dep_c dep_d sats_x_a sats_x_b close_v15a close_v15b sats_v15; do
            awk -v n="$n" '$0=="IMG_BEGIN "n".jpg"{getline; print; exit}' build/native.txt | base64 -d > "build/$n.jpg" || true
            sips --resampleWidth 720 "build/$n.jpg" --out "build/${n}_s.jpg" >/dev/null 2>&1 || true
            echo "IMG_BEGIN ${n}.jpg"; base64 -i "build/${n}_s.jpg" | tr -d '\n'; echo; echo "IMG_END"
          done
      - name: Jet Racers (race script test, native frames, the .saver bundle)
        run: |
          node tools/jetrace_test.js build/saver/three.min.js 30
          python3 tools/build_saver_html.py build/saver/three.min.js build/saver/GLTFLoader.js out/jetrace.html jetrace
          mkdir -p build/jet_res out/jetrace
          cp Saver/src/jetrace/*.glb Saver/src/jetrace/rigs.json Saver/src/jetrace.js build/saver/three.min.js build/jet_res/
          swiftc -O tools/jetrace_check/main.swift Saver/native/GLB.swift Saver/native/JetRace.swift -o build/jetrace_check
          ./build/jetrace_check build/jet_res out/jetrace || echo "::error::the native Jet Racers check failed"
          # anything SceneKit or Metal complained about while it ran (a shader that failed to compile shows up here)
          log show --last 4m --style compact --predicate 'process == "jetrace_check"' 2>/dev/null > build/jet_log.txt || true
          grep -i "error:\|failed compiling" build/jet_log.txt | cut -c1-300 | sort | uniq -c | head -40 || true
          for f in out/jetrace/*.jpg; do
            sips -s format jpeg -s formatOptions 55 --resampleWidth 640 "$f" --out "build/jet_s.jpg" >/dev/null 2>&1 || continue
            echo "IMG_BEGIN $(basename "$f")"; base64 -b 4000 -i build/jet_s.jpg; echo "IMG_END"
          done
          ./scripts/build-saver.sh "build/BoostBar Jet Racers.saver" 0.0.0 1 jetrace
          ls -l "build/BoostBar Jet Racers.saver/Contents/Resources"
      - name: WebKit check (as the .saver loads it)
        run: |
          swift tools/webkit_check.swift out/starships.html '{"count":4,"oxidation":0.8}' || true
          swift tools/webkit_check.swift out/saver.html '{"count":5}' | grep -v "^IMG\|^[A-Za-z0-9+/=]\{200,\}" || true
          # the Jet Racers page, as BoostBar's Preview window shows it (frames are wrapped: very long log lines get dropped)
          swift tools/webkit_check.swift out/jetrace.html '{"winner":"8","celebration":"dab"}' | fold -w 4000 | sed 's/^IMG_BEGIN webkit.jpg/IMG_BEGIN webkit_jetrace.jpg/' || true
      - name: Screenshots
        run: |
          npm install --no-save --silent puppeteer-core@23
          node tools/saver_shots.mjs "$PWD/out/starships.html" out oxhalf '{"count":4,"oxidation":0.5}'
          node tools/saver_shots.mjs "$PWD/out/starships.html" out oxfull '{"count":4,"oxidation":1}'
          node tools/saver_shots.mjs "$PWD/out/saver.html" out webclouds '{"count":7,"clouds":true}' | grep -i "error\|loaded\|TIMEOUT" || true
          node tools/saver_shots.mjs "$PWD/out/starships.html" out webroad '{"count":4,"roadster":true}' | grep -i "error\|loaded\|TIMEOUT" || true
          node tools/saver_shots.mjs "$PWD/out/starlink.html" out webx '{"count":12,"liveries":["v2","v3"],"crossing":true,"lasers":true}' | grep -i "error\|loaded\|TIMEOUT" || true
          node tools/saver_shots.mjs "$PWD/out/jetrace.html" out webjet '{"winner":"8","captions":true}' | grep -i "error\|loaded\|TIMEOUT" || true
          for f in out/oxhalf_1.png out/webx_3.png out/webclouds_3.png out/webroad_3.png; do
            sips -s format jpeg -s formatOptions 60 --resampleWidth 720 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "IMG_BEGIN $(basename "$f")"; base64 -i "${f%.png}.jpg" | tr -d '\n'; echo; echo "IMG_END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saver-preview
          path: |
            out/*.png
            out/jetrace/*.jpg
      - name: The app builds (Settings ▸ Screen Saver)
        run: swift build 2>&1 | tail -30
