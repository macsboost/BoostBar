name: Visitor Counter

# An old-school hit counter for the README, drawn as an odometer (tools/odometer.py). The README loads a 1px
# counting image on every view; this job reads the tally a few times a day, redraws the odometer and pushes it
# to the "counter" branch (so main's history stays clean).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths: ["tools/odometer.py", ".github/workflows/counter.yml"]

permissions:
  contents: write

concurrency: counter

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the tally and draw
        run: |
          mkdir -p out && cd out
          git init -q . && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin counter 2>/dev/null; then git checkout -q -b counter FETCH_HEAD; else git checkout -q --orphan counter; fi
          [ -f state.txt ] || echo "0 0" > state.txt          # "<count shown> <our own reads>"
          read SHOWN SELF < state.txt
          curl -fsS --max-time 20 -A "Mozilla/5.0 (BoostBar counter)" "https://komarev.com/ghpvc/?username=macsboost-boostbar&label=visits" -o /tmp/badge.svg || true
          echo "badge: $(head -c 1500 /tmp/badge.svg 2>/dev/null)"
          RAW=$(python3 -c "import re,sys; t=re.findall(r'>\s*([\d,]+)\s*<', open('/tmp/badge.svg').read()); print(t[-1].replace(',','') if t else '')" 2>/dev/null || true)
          echo "raw=$RAW shown=$SHOWN self=$SELF"
          # the tally only goes up for views that come through GitHub's image proxy, so reading it here doesn't count
          N=$SHOWN; [ -n "$RAW" ] && [ "$RAW" -gt "$SHOWN" ] && N=$RAW
          echo "$N 0" > state.txt
          python3 ../tools/odometer.py "$N" odometer.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -q -m "Visitor counter: $N"
          git push -q origin counter
