name: Screen Saver Video

# Records smooth 60 fps H.264 video of a native screen saver (the same SceneKit/Metal code the .saver runs).
on:
  workflow_dispatch:
    inputs:
      scene: { description: "cars | starships | starlink", default: "starlink" }
      seconds: { description: "length", default: "20" }
      config: { description: "JSON options", default: '{"count":12,"liveries":["v2","v3","deploy"],"crossing":true,"lasers":true}' }

permissions:
  contents: write

jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record
        run: |
          mkdir -p build/res
          cp Saver/native/X1_*.glb Saver/src/Starship.glb Saver/src/Roadster.glb Saver/src/Starlink.glb build/res/
          swiftc -O tools/native_video/main.swift Saver/native/GLB.swift Saver/native/Flock.swift -o build/native_video
          ./build/native_video build/res "build/${{ inputs.scene }}.mp4" "${{ inputs.scene }}" "${{ inputs.seconds }}" '${{ inputs.config }}'
          ls -la build/*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: saver-video
          path: build/*.mp4
      - name: Push to the "video" branch
        run: |
          cd build && mkdir pub && cd pub && git init -q . && git checkout -q --orphan video
          cp ../*.mp4 .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Screen saver video"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" video
